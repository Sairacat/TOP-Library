<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="layout">
    <div class="sidebar">
    <div class="wrapper">
        <div class="sidebar-title">
            My Little Library
        </div>
    <form class="book-sheet" novalidate>
    <div class="form-control">
        <label for="title">Title<span>*</span>: </label>
        <input type="text" id="title"  pattern="\D*" required>
        <span></span>
    </div>

    <div class="form-control">
        <label for="author">Author<span>*</span>: </label>
        <input type="text" id="author" pattern="\D*" required>
        <span></span>
    </div>

    <div class="form-control">
        <label for="pages">Pages<span>*</span>: </label>
        <input type="number" id="pages" required>
        <span></span>
    </div>

    <div class="form-read">
        <label for="status">Read or not: </label>
        <input type="checkbox" id="status">
    </div>

    <button type="submit" class="submit-btn">New Book</button>
    </form>
    </div>
    </div>

    <div class="bookshelf">
        <div class="toggle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px">
                <title>menu</title><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" fill="black"/>
            </svg>
        </div>
        <div class="card">
            <div class="booktitle">Sample Title</div>
            <div class="bookauthor">By Sample Author</div>
            <div class="bookpages">128 pages</div>
            <div class="statuslabel">Unfinished</div>
            <input class="bookstatus" type="checkbox">
            <button class="remove-btn">❌</button>
        </div>
    </div>
    </div>
</body>
</html>
