<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="layout">
    <div class="sidebar">
    <form class="book-sheet">
    <div>
        <label for="title">Title<span>*</span>: </label>
        <input type="text" id="title" required>
    </div>

    <div>
        <label for="author">Author<span>*</span>: </label>
        <input type="text" id="author" required>
    </div>

    <div>
        <label for="pages">Pages<span>*</span>: </label>
        <input type="number" id="pages" required>
    </div>

    <div>
        <label for="status">Read: </label>
        <input type="checkbox" id="status">
    </div>

    <button type="submit" class="submit-btn">SUBMIT</button>
    </form>
    </div>

    <div class="bookshelf">
        <div class="card">
            <div class="booktitle">ABC</div>
            <div class="bookauthor">By abc</div>
            <div class="bookpages">158</div>
            <input class="bookstatus" type="checkbox">
            <button class="remove-btn">Remove</button>
        </div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>
    </div>
</body>
</html>
